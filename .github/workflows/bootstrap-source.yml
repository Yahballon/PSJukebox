name: Import standalone PSJukebox source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import complete upstream app and all assets
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none https://github.com/Yahballon/tmp_lap.git /tmp/psjukebox-upstream
          cp -a /tmp/psjukebox-upstream/homebrew/psjukebox/. ./
          mkdir -p .github/workflows
          python3 - <<'PY'
          from pathlib import Path
          source=Path("/tmp/psjukebox-upstream/.github/workflows/build-psjukebox.yml").read_text()
          # Re-root the proven CI so the separate repository is self-contained.
          source=source.replace("'homebrew/psjukebox/**'", "'native/**'\n      - 'tests/**'\n      - 'tools/**'\n      - 'helper/**'\n      - 'assets/**'\n      - 'app.json'\n      - 'RELEASE_NOTES.md'")
          source=source.replace('homebrew/psjukebox/', '')
          Path(".github/workflows/build-psjukebox.yml").write_text(source)
          assert "homebrew/psjukebox/" not in source
          assert Path("native/main.cpp").is_file()
          assert Path("assets/neon-icon.webp").is_file()
          assert Path("tests/vinyl_motion_test.cpp").is_file()
          PY
      - name: Commit complete standalone source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import standalone PSJukebox source, assets, tests and native release pipeline"
          git push
