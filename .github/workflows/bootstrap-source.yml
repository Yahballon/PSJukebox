name: Import standalone PSJukebox source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import complete upstream app and all assets
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none https://github.com/Yahballon/tmp_lap.git /tmp/psjukebox-upstream
          cp -a /tmp/psjukebox-upstream/homebrew/psjukebox/. ./
          test -f native/main.cpp
          test -f assets/neon-icon.webp
          test -f tests/vinyl_motion_test.cpp
      - name: Commit complete standalone source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import standalone PSJukebox source, assets, tests and native release pipeline"
          git push
